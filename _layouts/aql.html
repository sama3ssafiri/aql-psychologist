<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.permalink != '/' %}{{ page.title | escape }} · {% endif %}Aql Psychologist</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="icon" type="image/png" href="{{ '/assets/img/aql-reach.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/aql.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Aql Psychologist home">
        <span>Aql</span><img src="{{ '/assets/img/aql-reach.png' | relative_url }}" alt="" width="38" height="38"><span>Psychologist</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/posts/' | relative_url }}"{% if page.permalink contains '/posts/' %} aria-current="{% if page.permalink == '/posts/' %}page{% else %}location{% endif %}"{% endif %}>Posts</a>
        <a href="{{ '/visuals/' | relative_url }}"{% if page.permalink == '/visuals/' %} aria-current="page"{% endif %}>Visuals</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.permalink == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </header>

    <main id="main" class="{% if page.permalink != '/' %}prose{% else %}homepage{% endif %}">
      {% if page.permalink != '/' %}<h1>{{ page.title | escape }}</h1>{% endif %}
      {{ content }}
    </main>
  </body>
</html>
