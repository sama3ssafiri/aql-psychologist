media:
  input: assets/img
  output: /assets/img
content:
- name: posts
  label: Posts
  type: collection
  path: _aql_posts
  format: yaml-frontmatter
  filename: '{primary}.md'
  operations:
    rename: false
  view:
    primary: title
    fields:
    - title
    - published
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: summary
    label: Summary for post lists and search
    type: text
    required: true
  - name: published
    label: Show on the site
    type: boolean
    default: false
  - name: order
    label: List order
    type: number
    default: 100
  - name: body
    label: Article
    type: rich-text
- name: home
  label: Home
  type: file
  path: _data/aql_home.yml
  fields:
  - name: heading
    label: Homepage heading
    type: string
    required: true
  - name: intro
    label: Introduction
    type: text
    required: true
  - name: credentials
    label: Credentials
    type: string
  - name: posts_heading
    label: Posts section heading
    type: string
    required: true
- name: about
  label: About – introduction
  type: file
  path: _pages/aql-about.md
  format: yaml-frontmatter
  fields:
  - name: layout
    type: string
    hidden: true
  - name: permalink
    type: string
    hidden: true
  - name: about_cv
    type: boolean
    hidden: true
    default: true
  - name: title
    label: Page heading
    type: string
    required: true
  - name: body
    label: Introductory biography
    type: rich-text
- name: brain_text
  label: Brain post – interactive text
  type: file
  path: _data/aql_brain.yml
  fields:
  - name: practice_heading
    label: Practice heading
    type: string
    required: true
  - name: model_note
    label: Note below the model
    type: text
    required: true
  - name: experiences
    label: Experiences and practice ideas
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
      min: 8
      max: 8
    fields:
    - name: id
      type: string
      hidden: true
      readonly: true
    - name: group
      type: string
      hidden: true
      readonly: true
    - name: label
      label: Button label
      type: string
      required: true
    - name: evidence
      label: What the research can tell us
      type: text
      required: true
    - name: practice
      label: One thing to practise
      type: text
      required: true
  - name: studies
    label: Research explanations and brain areas
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{heading}'
      min: 4
      max: 4
    fields:
    - name: id
      type: string
      hidden: true
      readonly: true
    - name: heading
      label: Heading
      type: string
      required: true
    - name: summary
      label: Simple research summary
      type: text
      required: true
    - name: source_url
      label: Research link
      type: string
      required: true
    - name: source_label
      label: Research link label
      type: string
      required: true
    - name: regions
      label: Brain area explanations
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
      fields:
      - name: id
        type: string
        hidden: true
        readonly: true
      - name: label
        label: Area label
        type: string
        required: true
      - name: note
        label: Explanation when selected
        type: text
        required: true
- name: cv
  label: About / CV – sections
  type: file
  path: _data/aql_cv.yml
  fields:
  - name: name
    label: Name
    type: string
  - name: role
    label: Professional title
    type: string
  - name: headline
    label: Main heading
    type: text
  - name: interests
    label: Interests
    type: text
  - name: credentials
    label: Qualifications and registration
    type: string
    list: true
  - name: linkedin_url
    label: LinkedIn URL
    type: string
  - name: contact_label
    label: Contact button
    type: string
  - name: print_label
    label: Print / save button
    type: string
  - name: sections
    label: Section navigation
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{label}'
      min: 5
      max: 5
    fields:
    - name: id
      type: string
      hidden: true
      readonly: true
    - name: label
      label: Navigation label
      type: string
    - name: caption
      label: Caption beside the scroll graphic
      type: text
  - name: presentations_heading
    label: Presentations heading
    type: text
  - name: presentations_intro
    label: Presentations introduction
    type: text
  - name: presentations
    label: Presentations
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title
      type: string
    - name: summary
      label: Short description
      type: text
    - name: detail
      label: More detail
      type: text
  - name: approaches_heading
    label: Approaches heading
    type: text
  - name: approaches_intro
    label: Approaches introduction
    type: text
  - name: approaches
    label: Approaches
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Title
      type: string
    - name: status
      label: Experience / training label
      type: string
    - name: summary
      label: Short description
      type: text
    - name: detail
      label: More detail
      type: text
  - name: practice_heading
    label: Work examples heading
    type: text
  - name: practice_intro
    label: Work examples introduction
    type: text
  - name: process_heading
    label: Working process heading
    type: text
  - name: process
    label: Working process
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Step
      type: string
    - name: text
      label: Explanation
      type: text
  - name: example_title
    label: Example heading
    type: text
  - name: example_label
    label: Example type label
    type: text
  - name: example_summary
    label: Example introduction
    type: text
  - name: example_steps
    label: Example walkthrough
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Heading
      type: string
    - name: text
      label: Explanation
      type: text
  - name: resources
    label: Resources and research
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: type
      label: Type
      type: string
    - name: title
      label: Title
      type: string
    - name: text
      label: Description
      type: text
    - name: url
      label: Link URL
      type: string
    - name: link_label
      label: Link label
      type: string
  - name: experience_heading
    label: Experience heading
    type: text
  - name: experience_intro
    label: Experience introduction
    type: text
  - name: roles
    label: Experience – roles only
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{title}'
    fields:
    - name: title
      label: Role
      type: string
    - name: context
      label: Context
      type: string
    - name: text
      label: Description
      type: text
  - name: closing_heading
    label: Closing heading
    type: text
  - name: closing_text
    label: Closing text
    type: text

- name: resources_page
  label: Resources – introduction
  type: file
  path: _pages/aql-resources.md
  format: yaml-frontmatter
  fields:
  - name: layout
    type: string
    hidden: true
  - name: permalink
    type: string
    hidden: true
  - name: title
    label: Page heading
    type: string
    required: true
  - name: body
    label: Resources introduction
    type: rich-text
